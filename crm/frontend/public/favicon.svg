<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <!-- Фон — скруглённый квадрат, как в сайдбаре -->
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- Центральный узел (менеджер) -->
  <circle cx="16" cy="9" r="4" fill="white"/>
  <!-- Партнёры -->
  <circle cx="7"  cy="24" r="3" fill="white" fill-opacity="0.75"/>
  <circle cx="25" cy="24" r="3" fill="white" fill-opacity="0.75"/>
  <!-- Линии -->
  <line x1="16" y1="13" x2="7"  y2="21" stroke="white" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="13" x2="25" y2="21" stroke="white" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round"/>
</svg>
