name: Deploy to VPS

on:
  push:
    branches:
      - claude/repair-request-tracking-6YfVM

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 85.198.70.155
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/yandex-kit-services
            git pull origin claude/repair-request-tracking-6YfVM
            cd crm
            docker compose up -d --build backend frontend
