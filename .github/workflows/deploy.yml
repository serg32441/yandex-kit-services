name: Deploy to VPS

on:
  push:
    branches:
      - claude/repair-request-tracking-6YfVM

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 85.198.70.155 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@85.198.70.155 "
            cd /root/yandex-kit-services &&
            git pull origin claude/repair-request-tracking-6YfVM &&
            cd crm &&
            docker compose up -d --build backend frontend
          "
