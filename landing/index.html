<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система работы с партнёрами</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAFAFA;
      color: #0F0F14;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 56px;
      height: 68px;
      background: rgba(250,250,250,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6366F1 0%, #9333EA 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(99,102,241,0.32);
      flex-shrink: 0;
    }
    .logo-name {
      font-size: 15px;
      font-weight: 700;
      color: #0F0F14;
      letter-spacing: -0.3px;
    }

    .nav-btn {
      font-size: 14px;
      font-weight: 500;
      color: #3A3A3C;
      text-decoration: none;
      padding: 8px 20px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.1);
      background: #fff;
      transition: all 0.15s;
      letter-spacing: -0.1px;
    }
    .nav-btn:hover {
      border-color: rgba(0,0,0,0.18);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* ── HERO ── */
    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      max-width: 1180px;
      margin: 0 auto;
      padding: 80px 56px 100px;
      gap: 72px;
      width: 100%;
      position: relative;
    }

    /* subtle bg glow */
    .hero::after {
      content: '';
      position: absolute;
      top: 0; right: -10%; bottom: 0;
      width: 55%;
      background: radial-gradient(ellipse at 60% 40%, rgba(99,102,241,0.07) 0%, transparent 65%),
                  radial-gradient(ellipse at 40% 70%, rgba(147,51,234,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── LEFT ── */
    .hero-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #EEF2FF;
      color: #4338CA;
      border-radius: 100px;
      padding: 5px 13px 5px 9px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 30px;
      border: 1px solid rgba(99,102,241,0.18);
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6366F1;
      box-shadow: 0 0 0 2.5px rgba(99,102,241,0.2);
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(36px, 4vw, 52px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -2.5px;
      color: #0F0F14;
      margin-bottom: 22px;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(135deg, #6366F1 10%, #9333EA 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 17px;
      color: #6E6E73;
      line-height: 1.78;
      max-width: 390px;
      margin-bottom: 42px;
      letter-spacing: -0.1px;
    }

    .cta-stack {
      display: flex;
      flex-direction: column;
      gap: 13px;
      width: 100%;
      max-width: 300px;
    }

    .btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6366F1 0%, #9333EA 100%);
      color: #fff;
      padding: 19px 28px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: -0.2px;
      transition: all 0.18s;
      box-shadow: 0 2px 8px rgba(99,102,241,0.25), 0 6px 20px rgba(99,102,241,0.2);
    }
    .btn-main:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99,102,241,0.3), 0 12px 32px rgba(99,102,241,0.22);
    }

    .btn-ghost {
      text-align: center;
      font-size: 14px;
      color: #AEAEB2;
      text-decoration: none;
      transition: color 0.15s;
      letter-spacing: -0.1px;
    }
    .btn-ghost:hover { color: #6E6E73; }

    /* ── RIGHT / MOCKUP ── */
    .hero-right {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .mockup-wrap {
      position: relative;
      width: 100%;
      max-width: 510px;
    }

    /* decorative floating card behind */
    .mockup-shadow-card {
      position: absolute;
      bottom: -18px;
      left: 16px;
      right: -16px;
      height: 100%;
      background: #fff;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      z-index: 0;
      opacity: 0.6;
    }

    .mockup {
      position: relative;
      z-index: 1;
      background: #fff;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.02),
        0 4px 8px rgba(0,0,0,0.04),
        0 16px 40px rgba(0,0,0,0.07),
        0 40px 80px rgba(0,0,0,0.05);
      overflow: hidden;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* browser chrome */
    .m-chrome {
      height: 36px;
      background: #F5F5F7;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 6px;
      flex-shrink: 0;
    }
    .m-dot { width: 10px; height: 10px; border-radius: 50%; }
    .d-r { background: #FF605A; }
    .d-y { background: #FFBD2E; }
    .d-g { background: #27C840; }

    /* address bar */
    .m-bar {
      flex: 1;
      max-width: 200px;
      margin: 0 auto;
      height: 20px;
      background: rgba(0,0,0,0.04);
      border-radius: 5px;
    }

    /* app layout */
    .m-body {
      display: flex;
      height: 300px;
    }

    /* sidebar */
    .m-sidebar {
      width: 48px;
      background: #1C1C1E;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 10px;
      gap: 6px;
      border-right: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .m-logo-spot {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, #6366F1, #9333EA);
      margin-bottom: 10px;
    }
    .m-si {
      width: 32px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .m-si.active { background: rgba(99,102,241,0.22); }
    .m-si svg { opacity: 0.35; }
    .m-si.active svg { opacity: 0.9; }

    /* content */
    .m-content {
      flex: 1;
      background: #F5F5F7;
      padding: 14px 14px 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* stat cards */
    .m-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      flex-shrink: 0;
    }
    .m-stat {
      background: #fff;
      border-radius: 9px;
      padding: 9px 10px 8px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .m-stat-lbl {
      height: 5px;
      border-radius: 3px;
      background: #E5E5EA;
      width: 72%;
      margin-bottom: 7px;
    }
    .m-stat-num {
      font-size: 18px;
      font-weight: 700;
      color: #1D1D1F;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    /* new req button placeholder */
    .m-btn-row {
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .m-btn-pill {
      height: 26px;
      width: 96px;
      background: #1D1D1F;
      border-radius: 8px;
      opacity: 0.85;
    }

    /* list */
    .m-list {
      background: #fff;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.04);
      flex: 1;
    }
    .m-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;
      border-bottom: 1px solid rgba(0,0,0,0.03);
    }
    .m-row:last-child { border-bottom: none; }

    .m-ava {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .m-info { flex: 1; min-width: 0; }
    .m-line-a {
      height: 6px;
      border-radius: 3px;
      background: #E5E5EA;
      margin-bottom: 4px;
    }
    .m-line-b {
      height: 4px;
      border-radius: 2px;
      background: #F2F2F7;
      width: 55%;
    }

    .m-tag {
      font-size: 8.5px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 100px;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.1px;
    }
    .t-indigo { background: #EEF2FF; color: #4F46E5; }
    .t-amber  { background: #FFFBEB; color: #B45309; }
    .t-green  { background: #ECFDF5; color: #059669; }
    .t-gray   { background: #F2F2F7; color: #6E6E73; }
    .t-violet { background: #F5F3FF; color: #7C3AED; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 28px 24px;
      font-size: 13px;
      color: #C7C7CC;
      letter-spacing: -0.1px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 960px) {
      nav  { padding: 0 28px; }
      .hero {
        grid-template-columns: 1fr;
        padding: 60px 28px 80px;
        gap: 52px;
        text-align: center;
      }
      .hero::after { display: none; }
      .hero-left { align-items: center; }
      .subtitle  { max-width: 100%; }
      .cta-stack { max-width: 100%; }
      .hero-right { justify-content: center; }
      .mockup-wrap { max-width: 460px; }
    }

    @media (max-width: 600px) {
      nav { padding: 0 20px; height: 62px; }
      .hero { padding: 24px 20px 64px; gap: 44px; }
      h1 { letter-spacing: -1.5px; }
      .subtitle { font-size: 16px; }
      .hero-right { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="/" class="logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="6" r="4" fill="white"/>
          <circle cx="5"  cy="22" r="3"   fill="white" fill-opacity=".7"/>
          <circle cx="23" cy="22" r="3"   fill="white" fill-opacity=".7"/>
          <line x1="14" y1="10" x2="5"  y2="19" stroke="white" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="14" y1="10" x2="23" y2="19" stroke="white" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="8"  y1="22" x2="20" y2="22" stroke="white" stroke-opacity=".25" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-name">CRM</span>
    </a>
    <a href="https://crm.chm-sochi.ru/login" class="nav-btn">Войти</a>
  </nav>

  <!-- HERO -->
  <section class="hero">

    <!-- LEFT: text + CTAs -->
    <div class="hero-left">

      <span class="badge">
        <span class="badge-dot"></span>
        Бесплатно
      </span>

      <h1>Система работы<br>с <em>партнёрами</em></h1>

      <p class="subtitle">
        Для тех, кто работает с партнёрами<br>
        и передаёт им заявки.<br>
        Регистрируйтесь — это бесплатно.
      </p>

      <div class="cta-stack">
        <a href="https://crm.chm-sochi.ru/register" class="btn-main">Зарегистрироваться</a>
        <a href="https://crm.chm-sochi.ru/login"    class="btn-ghost">Уже есть аккаунт →</a>
      </div>

    </div>

    <!-- RIGHT: CRM mockup -->
    <div class="hero-right">
      <div class="mockup-wrap">

        <div class="mockup-shadow-card"></div>

        <div class="mockup">

          <!-- browser chrome -->
          <div class="m-chrome">
            <span class="m-dot d-r"></span>
            <span class="m-dot d-y"></span>
            <span class="m-dot d-g"></span>
            <div class="m-bar"></div>
          </div>

          <!-- app -->
          <div class="m-body">

            <!-- sidebar -->
            <div class="m-sidebar">
              <div class="m-logo-spot"></div>
              <!-- dashboard icon (active) -->
              <div class="m-si active">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" rx="1.2"/>
                  <rect x="14" y="3" width="7" height="7" rx="1.2"/>
                  <rect x="14" y="14" width="7" height="7" rx="1.2"/>
                  <rect x="3" y="14" width="7" height="7" rx="1.2"/>
                </svg>
              </div>
              <!-- requests -->
              <div class="m-si">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
              </div>
              <!-- partners -->
              <div class="m-si">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              </div>
            </div>

            <!-- content -->
            <div class="m-content">

              <!-- stat cards -->
              <div class="m-stats">
                <div class="m-stat">
                  <div class="m-stat-lbl"></div>
                  <div class="m-stat-num">12</div>
                </div>
                <div class="m-stat">
                  <div class="m-stat-lbl" style="width:60%"></div>
                  <div class="m-stat-num">5</div>
                </div>
                <div class="m-stat">
                  <div class="m-stat-lbl" style="width:80%"></div>
                  <div class="m-stat-num">3</div>
                </div>
              </div>

              <!-- new request button -->
              <div class="m-btn-row">
                <div class="m-btn-pill"></div>
              </div>

              <!-- requests list -->
              <div class="m-list">
                <div class="m-row">
                  <div class="m-ava" style="background:#EEF2FF;"></div>
                  <div class="m-info">
                    <div class="m-line-a" style="width:78%"></div>
                    <div class="m-line-b"></div>
                  </div>
                  <span class="m-tag t-amber">В работе</span>
                </div>
                <div class="m-row">
                  <div class="m-ava" style="background:#ECFDF5;"></div>
                  <div class="m-info">
                    <div class="m-line-a" style="width:65%"></div>
                    <div class="m-line-b" style="width:48%"></div>
                  </div>
                  <span class="m-tag t-indigo">Передана</span>
                </div>
                <div class="m-row">
                  <div class="m-ava" style="background:#FFF7ED;"></div>
                  <div class="m-info">
                    <div class="m-line-a" style="width:72%"></div>
                    <div class="m-line-b" style="width:42%"></div>
                  </div>
                  <span class="m-tag t-green">Готово</span>
                </div>
                <div class="m-row">
                  <div class="m-ava" style="background:#F5F3FF;"></div>
                  <div class="m-info">
                    <div class="m-line-a" style="width:58%"></div>
                    <div class="m-line-b" style="width:36%"></div>
                  </div>
                  <span class="m-tag t-violet">Ждёт</span>
                </div>
                <div class="m-row">
                  <div class="m-ava" style="background:#F2F2F7;"></div>
                  <div class="m-info">
                    <div class="m-line-a" style="width:70%"></div>
                    <div class="m-line-b" style="width:50%"></div>
                  </div>
                  <span class="m-tag t-gray">Закрыта</span>
                </div>
              </div>

            </div><!-- /m-content -->
          </div><!-- /m-body -->
        </div><!-- /mockup -->
      </div><!-- /mockup-wrap -->
    </div><!-- /hero-right -->

  </section>

  <footer>© 2026</footer>

</body>
</html>
