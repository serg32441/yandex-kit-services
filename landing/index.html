<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система работы с партнёрами</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: #0c0c10;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 64px;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-login {
      font-size: .85rem;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-weight: 500;
      transition: color .15s;
    }
    .nav-login:hover { color: rgba(255,255,255,0.8); }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 80px;
    }

    .tag {
      display: inline-block;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.4);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: .72rem;
      font-weight: 600;
      margin-bottom: 32px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.6rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #fff;
      max-width: 580px;
      margin-bottom: 20px;
    }

    h1 em {
      font-style: normal;
      background: linear-gradient(135deg, #818cf8 0%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: .98rem;
      color: rgba(255,255,255,0.38);
      line-height: 1.8;
      max-width: 380px;
      margin-bottom: 44px;
    }

    .cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 320px;
    }

    .btn-main {
      display: block;
      width: 100%;
      text-align: center;
      background: #fff;
      color: #0c0c10;
      padding: 16px 32px;
      border-radius: 100px;
      font-size: .9rem;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .15s, transform .15s;
    }
    .btn-main:hover {
      opacity: .88;
      transform: translateY(-1px);
    }

    .btn-login {
      font-size: .82rem;
      color: rgba(255,255,255,0.28);
      text-decoration: none;
      transition: color .15s;
    }
    .btn-login:hover { color: rgba(255,255,255,0.6); }

    footer {
      text-align: center;
      padding: 24px;
      font-size: .72rem;
      color: rgba(255,255,255,0.12);
    }

    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      .hero { padding: 40px 20px 60px; }
      h1 { letter-spacing: -.5px; }
      .cta-wrap { max-width: 100%; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo-mark">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="6" r="4" fill="white"/>
        <circle cx="5" cy="22" r="3.5" fill="white" fill-opacity="0.5"/>
        <circle cx="23" cy="22" r="3.5" fill="white" fill-opacity="0.5"/>
        <line x1="14" y1="10" x2="5" y2="18.5" stroke="white" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="14" y1="10" x2="23" y2="18.5" stroke="white" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="8" y1="22" x2="20" y2="22" stroke="white" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </a>
    <a href="https://crm.chm-sochi.ru/login" class="nav-login">Войти</a>
  </nav>

  <section class="hero">
    <span class="tag">Бесплатно</span>

    <h1>Система работы<br>с <em>партнёрами</em></h1>

    <p class="subtitle">
      Для тех, кто работает с партнёрами<br>
      и передаёт им заявки.<br>
      Регистрируйтесь — это бесплатно.
    </p>

    <div class="cta-wrap">
      <a href="https://crm.chm-sochi.ru/register" class="btn-main">Зарегистрироваться</a>
      <a href="https://crm.chm-sochi.ru/login" class="btn-login">Уже есть аккаунт →</a>
    </div>
  </section>

  <footer>© 2026</footer>

</body>
</html>
