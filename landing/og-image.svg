<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F6FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Логотип -->
  <g transform="translate(96, 86)">
    <rect width="64" height="64" rx="16" fill="url(#brand)"/>
    <circle cx="32" cy="18" r="8" fill="white"/>
    <circle cx="14" cy="48" r="6" fill="white" fill-opacity="0.75"/>
    <circle cx="50" cy="48" r="6" fill="white" fill-opacity="0.75"/>
    <line x1="32" y1="26" x2="14" y2="42" stroke="white" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="26" x2="50" y2="42" stroke="white" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round"/>
    <text x="84" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0F0F14">РемХаб</text>
  </g>

  <!-- Заголовок -->
  <text x="96" y="290" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="#0F0F14">CRM для распределения</text>
  <text x="96" y="378" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="url(#brand)">заявок партнёрам</text>

  <!-- Подзаголовок -->
  <text x="96" y="452" font-family="Arial, sans-serif" font-size="32" font-weight="500" fill="#6E6E73">Сотни заявок, десятки партнёров в разных городах —</text>
  <text x="96" y="496" font-family="Arial, sans-serif" font-size="32" font-weight="500" fill="#6E6E73">на одном экране. Бесплатно на старте.</text>

  <!-- Плашка домена -->
  <rect x="96" y="540" width="240" height="50" rx="25" fill="url(#brand)"/>
  <text x="216" y="572" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="white" text-anchor="middle">chm-sochi.ru</text>
</svg>
