# Landing page — chm-sochi.ru
server {
    listen 80;
    server_name chm-sochi.ru www.chm-sochi.ru;

    root /root/yandex-kit-services/landing;
    index index.html;

    # SEO-файлы (отдаются как статика из корня лендинга)
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # Блог на WordPress (подкаталог /blog) — reverse proxy на контейнер
    location = /blog { return 301 /blog/; }
    location /blog/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# CRM — crm.chm-sochi.ru
server {
    listen 80;
    server_name crm.chm-sochi.ru;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
