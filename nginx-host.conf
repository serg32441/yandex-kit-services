# Landing page — chm-sochi.ru
server {
    listen 80;
    server_name chm-sochi.ru www.chm-sochi.ru;

    root /root/yandex-kit-services/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# CRM — crm.chm-sochi.ru
server {
    listen 80;
    server_name crm.chm-sochi.ru;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
